<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Prompts - Productos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Animación para las nuevas filas de productos */
        .slide-in {
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Animación suave para notificaciones */
        .fade-in-out {
            animation: fadeInOut 3s forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-12 transition-colors duration-300" id="pageBody">

    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pt-10">
        
        <div class="text-center mb-10">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Generador de Sección de Productos</h1>
            <p class="text-gray-500">Configura tu catálogo para generar el prompt perfecto para tu IA.</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden mb-8">
            
            <!-- SECCIÓN 1: Títulos y WhatsApp -->
            <div class="p-6 md:p-8 border-b border-gray-100 bg-gray-50/50">
                <h2 class="text-lg font-bold text-gray-800 mb-5 flex items-center">
                    <span class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center mr-3 text-sm">1</span>
                    Encabezado y Contacto
                </h2>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Título de la Sección</label>
                        <input type="text" id="sectionTitle" value="Nuestros Productos" class="w-full p-3 bg-white border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-sm" placeholder="Ej: Catálogo 2024">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Eslogan o Subtítulo</label>
                        <input type="text" id="sectionSlogan" value="Descubre nuestra mejor selección de artículos" class="w-full p-3 bg-white border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-sm" placeholder="Breve descripción de tus productos">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Número de WhatsApp para Ventas</label>
                        <div class="flex items-center bg-white border border-gray-300 rounded-xl overflow-hidden shadow-sm focus-within:ring-2 focus-within:ring-green-500 transition-all">
                            <span class="bg-gray-100 px-4 py-3 border-r border-gray-300 text-gray-600 font-semibold flex items-center gap-2">
                                <svg class="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                                +51
                            </span>
                            <input type="tel" id="whatsappNumber" class="w-full p-3 outline-none focus:ring-0 text-gray-700" placeholder="999888777">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Columnas (en PC)</label>
                        <select id="gridColumns" class="w-full p-3 bg-white border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none shadow-sm cursor-pointer">
                            <option value="2">2 Columnas</option>
                            <option value="3" selected>3 Columnas</option>
                            <option value="4">4 Columnas</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN 2: Lista de Productos -->
            <div class="p-6 md:p-8 border-b border-gray-100">
                <div class="flex justify-between items-center mb-5">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center">
                        <span class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center mr-3 text-sm">2</span>
                        Lista de Productos
                    </h2>
                    <span id="productCountBadge" class="bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full">3 Productos</span>
                </div>

                <div id="productsList" class="space-y-4 mb-6">
                    <!-- Los productos se insertarán aquí con JS -->
                </div>

                <button id="addProductBtn" class="w-full py-4 border-2 border-dashed border-gray-300 rounded-xl text-gray-500 font-semibold hover:border-blue-500 hover:text-blue-600 transition-colors flex items-center justify-center bg-gray-50 hover:bg-blue-50">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                    Agregar otro producto
                </button>
            </div>

            <!-- SECCIÓN 3: Colores -->
            <div class="p-6 md:p-8 border-b border-gray-100 bg-gray-50/50">
                <h2 class="text-lg font-bold text-gray-800 mb-5 flex items-center">
                    <span class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center mr-3 text-sm">3</span>
                    Colores de la Sección
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                    <div class="flex flex-col bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                        <label class="text-sm font-semibold text-gray-700 mb-3">Color Primario (Botones)</label>
                        <div class="flex items-center space-x-3">
                            <input type="color" id="primaryColor" value="#25D366" class="h-12 w-20 p-1 rounded cursor-pointer border border-gray-200">
                            <span id="primaryHex" class="text-sm text-gray-500 font-mono font-medium">#25D366</span>
                        </div>
                    </div>
                    <div class="flex flex-col bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                        <label class="text-sm font-semibold text-gray-700 mb-3">Color Secundario (Hover)</label>
                        <div class="flex items-center space-x-3">
                            <input type="color" id="secondaryColor" value="#128C7E" class="h-12 w-20 p-1 rounded cursor-pointer border border-gray-200">
                            <span id="secondaryHex" class="text-sm text-gray-500 font-mono font-medium">#128C7E</span>
                        </div>
                    </div>
                    <div class="flex flex-col bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
                        <label class="text-sm font-semibold text-gray-700 mb-3">Fondo de Página</label>
                        <div class="flex items-center space-x-3">
                            <input type="color" id="bgColor" value="#F3F4F6" class="h-12 w-20 p-1 rounded cursor-pointer border border-gray-200">
                            <span id="bgHex" class="text-sm text-gray-500 font-mono font-medium">#F3F4F6</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botón Generar -->
            <div class="p-8 text-center bg-white">
                <button id="generateBtn" class="w-full md:w-auto md:px-12 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-full shadow-lg transition-transform transform hover:-translate-y-1 focus:outline-none focus:ring-4 focus:ring-blue-300 text-lg flex items-center justify-center mx-auto">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                    Generar Prompt de Productos
                </button>
            </div>
        </div>

        <!-- Resultado del Prompt -->
        <div id="resultContainer" class="bg-gray-900 rounded-2xl p-6 shadow-xl hidden mb-10">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-white font-semibold flex items-center text-lg">
                    <svg class="w-6 h-6 mr-2 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Tu Prompt está listo
                </h3>
                <button id="copyBtn" class="text-gray-900 bg-white hover:bg-gray-100 px-4 py-2 rounded-xl text-sm font-bold transition-colors flex items-center shadow-sm">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    Copiar Prompt
                </button>
            </div>
            <textarea id="promptOutput" class="w-full h-80 bg-gray-800 text-gray-200 p-5 rounded-xl font-mono text-sm border border-gray-700 outline-none resize-y focus:border-blue-500 focus:ring-1 focus:ring-blue-500 leading-relaxed" readonly></textarea>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-green-500 text-white px-6 py-4 rounded-xl shadow-2xl font-medium hidden flex items-center">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        ¡Prompt copiado al portapapeles!
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const productsList = document.getElementById('productsList');
            const addProductBtn = document.getElementById('addProductBtn');
            const productCountBadge = document.getElementById('productCountBadge');
            
            const generateBtn = document.getElementById('generateBtn');
            const resultContainer = document.getElementById('resultContainer');
            const promptOutput = document.getElementById('promptOutput');
            const copyBtn = document.getElementById('copyBtn');
            const toast = document.getElementById('toast');

            let productCounter = 0;

            // Función para crear una fila de producto con campo de imagen
            function createProductItem(defaultName = "", defaultPrice = "", defaultImg = "") {
                productCounter++;
                const id = `prod_${productCounter}`;
                
                const div = document.createElement('div');
                div.className = 'product-item slide-in bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-gray-200';
                div.id = id;

                div.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                        <div class="md:col-span-4">
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Nombre del Producto</label>
                            <input type="text" class="product-name w-full p-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="Ej: Zapatillas Deportivas" value="${defaultName}">
                        </div>
                        <div class="md:col-span-3">
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Precio</label>
                            <input type="text" class="product-price w-full p-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="Ej: S/ 120.00" value="${defaultPrice}">
                        </div>
                        <div class="md:col-span-4">
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">URL de la Imagen</label>
                            <input type="url" class="product-img w-full p-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="https://..." value="${defaultImg}">
                        </div>
                        <div class="md:col-span-1 flex justify-end">
                            <button type="button" class="delete-btn w-full p-3 text-red-500 hover:text-white hover:bg-red-500 border border-red-200 rounded-xl transition-colors flex items-center justify-center" aria-label="Eliminar producto" title="Eliminar este producto">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                `;

                // Botón de eliminar
                div.querySelector('.delete-btn').addEventListener('click', () => {
                    div.remove();
                    updateProductBadge();
                });

                productsList.appendChild(div);
                updateProductBadge();
            }

            function updateProductBadge() {
                const count = productsList.querySelectorAll('.product-item').length;
                productCountBadge.textContent = count === 1 ? '1 Producto' : `${count} Productos`;
            }

            // Inicializar con 3 productos de ejemplo con URLs de placeholders por defecto
            createProductItem("Camiseta Básica", "S/ 45.00", "https://placehold.co/400x400/e2e8f0/475569?text=Camiseta");
            createProductItem("Pantalón Denim", "S/ 95.00", "https://placehold.co/400x400/e2e8f0/475569?text=Pantalon");
            createProductItem("Zapatillas Urbanas", "S/ 150.00", "https://placehold.co/400x400/e2e8f0/475569?text=Zapatillas");

            // Evento para agregar producto manual
            addProductBtn.addEventListener('click', () => {
                createProductItem();
            });

            const primaryColor = document.getElementById('primaryColor');
            const secondaryColor = document.getElementById('secondaryColor');
            const bgColor = document.getElementById('bgColor');
            
            primaryColor.addEventListener('input', (e) => document.getElementById('primaryHex').textContent = e.target.value.toUpperCase());
            secondaryColor.addEventListener('input', (e) => document.getElementById('secondaryHex').textContent = e.target.value.toUpperCase());
            bgColor.addEventListener('input', (e) => {
                document.getElementById('bgHex').textContent = e.target.value.toUpperCase();
                document.getElementById('pageBody').style.backgroundColor = e.target.value;
            });

            generateBtn.addEventListener('click', () => {
                const title = document.getElementById('sectionTitle').value.trim() || "Nuestros Productos";
                const slogan = document.getElementById('sectionSlogan').value.trim() || "Descubre nuestra colección";
                const wsp = document.getElementById('whatsappNumber').value.trim() || "999999999";
                const cols = document.getElementById('gridColumns').value;
                
                const cPrimario = primaryColor.value;
                const cSecundario = secondaryColor.value;
                const cFondo = bgColor.value;

                let productDefinitions = "";
                const productElements = document.querySelectorAll('.product-item');
                
                productElements.forEach((el, index) => {
                    const name = el.querySelector('.product-name').value.trim() || `Producto ${index + 1}`;
                    const price = el.querySelector('.product-price').value.trim() || "Consultar";
                    const imgUrl = el.querySelector('.product-img').value.trim() || `https://placehold.co/400x400/e2e8f0/475569?text=${encodeURIComponent(name)}`;
                    
                    // Texto codificado para WhatsApp
                    const msgText = encodeURIComponent(`Hola, me interesa el producto: ${name}`);
                    const wplink = `https://wa.me/51${wsp}?text=${msgText}`;

                    productDefinitions += `
- TARJETA DE PRODUCTO ${index + 1}:
  * Imagen a mostrar: Usa exactamente este código -> <img src="${imgUrl}" alt="${name}">
  * Nombre: "${name}"
  * Precio: "${price}"
  * Botón CTA: Debe decir "Comprar", incluir un icono de WhatsApp, y tener un enlace <a> hacia: ${wplink}
`;
                });

                const promptFinal = `Actúa como un desarrollador web experto y diseñador UI/UX.
Necesito que generes el código HTML y CSS (usa Tailwind CSS) para una "Sección de Productos" de una página web.

⚠️ REGLAS ESTRICTAS (DEBES CUMPLIRLAS TODAS O HABRÁ ERRORES):
1. NO incluyas un menú de navegación (navbar) ni encabezados de la página.
2. NO incluyas un footer (pie de página).
3. Entrega todo en UN SOLO archivo HTML con estilos integrados.
4. Hazla 100% responsiva. En móviles debe mostrarse 1 columna, en tablets 2 columnas, y en pantallas de escritorio DEBE TENER EXACTAMENTE ${cols} COLUMNAS (usa grid-cols-${cols} u otra técnica que fuerce esa cantidad).

🎨 DISEÑO Y COLORES:
- Color de Fondo de la sección: ${cFondo}
- Color Principal (Botones de compra): ${cPrimario}
- Color Secundario (Hover de los botones): ${cSecundario}

ESTRUCTURA DE LA SECCIÓN:

1. ENCABEZADOS (Alineados al centro):
   - Título principal: "${title}"
   - Eslogan (debajo del título): "${slogan}"

2. CUADRÍCULA DE PRODUCTOS:
Crea un grid responsivo e inserta dentro las siguientes tarjetas:
${productDefinitions}

Genera solo el código final estructurado y listo para copiar y probar.`;

                promptOutput.value = promptFinal;
                
                // Mostrar resultado con animación
                resultContainer.classList.remove('hidden');
                resultContainer.classList.add('slide-in');
                
                // Scroll hacia el resultado
                setTimeout(() => {
                    resultContainer.scrollIntoView({ behavior: 'smooth', block: 'end' });
                }, 100);
            });

            // Función de copiar
            copyBtn.addEventListener('click', () => {
                if (!promptOutput.value) return;

                promptOutput.select();
                promptOutput.setSelectionRange(0, 99999);

                try {
                    document.execCommand('copy');
                    window.getSelection().removeAllRanges();
                    
                    toast.classList.remove('hidden');
                    toast.classList.add('fade-in-out');
                    
                    setTimeout(() => {
                        toast.classList.add('hidden');
                        toast.classList.remove('fade-in-out');
                    }, 3000);
                } catch (err) {
                    navigator.clipboard.writeText(promptOutput.value);
                }
            });
        });
    </script>
</body>
</html>
